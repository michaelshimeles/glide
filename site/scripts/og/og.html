<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Inter Variable';
				font-weight: 100 900;
				src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2)
					format('woff2-variations');
			}
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				position: relative;
				background:
					radial-gradient(ellipse 560px 420px at 14% 18%, rgba(110, 155, 255, 0.1), transparent 70%),
					#0a0a0b;
				color: #f4f4f5;
				font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
			}
			.copy {
				position: absolute;
				left: 72px;
				top: 72px;
				width: 540px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 20px;
				font-size: 30px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			.brand img {
				width: 84px;
				height: 84px;
			}
			h1 {
				margin: 56px 0 20px;
				font-size: 56px;
				line-height: 1.04;
				font-weight: 700;
				letter-spacing: -0.035em;
			}
			p {
				margin: 0;
				color: #8e8e93;
				font-size: 24px;
				line-height: 1.4;
			}
			.pill {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				margin-top: 36px;
				padding: 14px 24px 14px 22px;
				border-radius: 999px;
				background: #f5f5f7;
				color: #000;
				font-size: 20px;
				font-weight: 600;
			}
			.pill svg {
				width: 17px;
				height: 21px;
			}
			.shot {
				position: absolute;
				left: 640px;
				top: 92px;
				width: 1000px;
				border-radius: 14px;
				box-shadow:
					0 0 0 1px rgba(255, 255, 255, 0.1),
					0 30px 80px rgba(0, 0, 0, 0.6);
			}
			/* DaisyCap's recording bar (recbar.rs, 286×44 points) at 1.5×. */
			.bar {
				position: absolute;
				left: 700px;
				top: 470px;
				width: 286px;
				height: 44px;
				border-radius: 22px;
				background: rgba(30, 30, 32, 0.78);
				backdrop-filter: blur(20px) saturate(160%);
				box-shadow:
					inset 0 0 0 1px rgba(255, 255, 255, 0.14),
					0 12px 32px rgba(0, 0, 0, 0.45);
				transform: scale(1.5);
				transform-origin: 0 0;
			}
			.bar > * {
				position: absolute;
			}
			.dot {
				top: 17px;
				left: 18px;
				width: 10px;
				height: 10px;
				border-radius: 50%;
				background: #ff453a;
			}
			.timer {
				left: 36px;
				font: 600 15px/44px 'Inter Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
				font-variant-numeric: tabular-nums;
			}
			.sep {
				top: 12px;
				width: 1px;
				height: 20px;
				background: rgba(255, 255, 255, 0.18);
			}
			.icon {
				top: 7px;
				display: grid;
				place-items: center;
				width: 30px;
				height: 30px;
			}
			.icon svg {
				width: 14px;
				height: 14px;
				fill: none;
				stroke: rgba(255, 255, 255, 0.92);
				stroke-width: 1.7;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			.icon svg.solid {
				fill: rgba(255, 255, 255, 0.92);
				stroke: none;
			}
			.stop {
				top: 7px;
				left: 244px;
				display: grid;
				place-items: center;
				width: 30px;
				height: 30px;
				border-radius: 50%;
				background: #ff453a;
			}
			.stop span {
				width: 10px;
				height: 10px;
				border-radius: 2px;
				background: #fff;
			}
		</style>
	</head>
	<body>
		<div class="copy">
			<div class="brand"><img src="icon.png" alt="" />DaisyCap</div>
			<h1>Product videos,<br />in one take.</h1>
			<p>An open-source screen recorder<br />for the Mac, written in Rust.</p>
			<div class="pill">
				<svg viewBox="0 0 17 21">
					<path
						d="M11.2 4.3c.6-.8 1-1.8.9-2.8-.9 0-2 .6-2.6 1.4-.6.7-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.3zM12.1 5.8c-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.9-.8C4.4 5.9 3 6.8 2.2 8.1c-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.8 2.3 1.1 0 1.6-.7 2.9-.7 1.4 0 1.8.7 2.9.7 1.2 0 2-1.1 2.7-2.2.9-1.3 1.2-2.5 1.2-2.6 0 0-2.4-.9-2.4-3.6 0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7z"
					/>
				</svg>
				Free for macOS
			</div>
		</div>
		<img class="shot" src="frame.png" alt="" />
		<div class="bar">
			<span class="dot"></span>
			<span class="timer">00:12</span>
			<span class="sep" style="left: 124px"></span>
			<span class="icon" style="left: 132px">
				<svg viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" /></svg>
			</span>
			<span class="icon" style="left: 164px">
				<svg viewBox="0 0 14 14"><path d="M3.6 4.1A4.6 4.6 0 1 1 2.4 8.2" /><path d="M2.6 1.8v2.8h2.8" /></svg>
			</span>
			<span class="icon" style="left: 196px">
				<svg viewBox="0 0 14 14" class="solid">
					<rect x="3.2" y="2.5" width="2.6" height="9" rx="0.7" />
					<rect x="8.2" y="2.5" width="2.6" height="9" rx="0.7" />
				</svg>
			</span>
			<span class="sep" style="left: 234px"></span>
			<span class="stop"><span></span></span>
		</div>
	</body>
</html>
